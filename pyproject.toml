[project]
name = "agritime"
version = "0.1.0"
description = "Time-series mining + predictive modeling lab on public agricultural data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Vinicius Branco" }]
dependencies = [
    # data
    "pandas>=2.2",
    "polars>=1.7",
    "pyarrow>=17.0",
    "numpy>=1.26,<2.2",
    "requests>=2.32",
    "httpx>=0.27",
    # storage
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    # forecasting
    "statsmodels>=0.14",
    "prophet>=1.1.5",
    "darts>=0.30",
    "sktime>=0.30",
    "lightgbm>=4.5",
    # deep
    "torch>=2.4",
    "pytorch-forecasting>=1.0",
    "pytorch-lightning>=2.4",
    # ts classification + anomaly
    "aeon>=0.11",
    "stumpy>=1.13",
    # geospatial
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "rioxarray>=0.17",
    "xarray>=2024.7",
    "stackstac>=0.5",
    "pystac-client>=0.8",
    # calibration / UQ
    "mapie>=0.9",
    "scikit-learn>=1.5",
    # MLOps
    "mlflow>=2.16",
    "optuna>=4.0",
    "evidently>=0.4.30",
    "hydra-core>=1.3",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "mlflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
